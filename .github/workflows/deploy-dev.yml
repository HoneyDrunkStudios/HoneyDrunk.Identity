name: Deploy Identity dev

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'B1 updates the serving site directly; interruptions are possible. Rollback redeploys a retained image, not SQL.'
        type: choice
        options: [deploy, rollback]
        default: deploy
        required: true
      rollback-image:
        description: 'Rollback only: exact retained ACR digest from reviewed release evidence.'
        type: string
      rollback-release-id:
        description: 'Rollback only: baked release ID recorded with that image.'
        type: string

permissions:
  contents: read

concurrency:
  group: identity-dev-release
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Require reviewed setup and protected environment
        env:
          GH_TOKEN: ${{ github.token }}
          ENABLED: ${{ vars.IDENTITY_DEPLOYMENT_APPROVED }}
          APP: ${{ vars.IDENTITY_APP_NAME }}
          CLIENT: ${{ vars.AZURE_CLIENT_ID }}
          TENANT: ${{ vars.AZURE_TENANT_ID }}
          SUBSCRIPTION: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          OPERATION: ${{ inputs.operation }}
          ROLLBACK_IMAGE: ${{ inputs.rollback-image }}
          ROLLBACK_RELEASE: ${{ inputs.rollback-release-id }}
        run: |
          set -euo pipefail
          test "$ENABLED" = 'true'
          test -n "$APP" && test -n "$CLIENT" && test -n "$TENANT" && test -n "$SUBSCRIPTION"
          gh api "repos/$GITHUB_REPOSITORY/environments/dev" --jq '.protection_rules[] | select(.type == "required_reviewers") | .reviewers | length' | grep -Eq '^[1-9][0-9]*$'
          if [ "$OPERATION" = rollback ]; then
            test -n "$ROLLBACK_IMAGE" && test -n "$ROLLBACK_RELEASE"
          else
            test -z "$ROLLBACK_IMAGE" && test -z "$ROLLBACK_RELEASE"
          fi
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Build and push unique release image
        id: build
        if: inputs.operation == 'deploy'
        run: |
          set -euo pipefail
          release="dev-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          tag="acrhdshareddev.azurecr.io/honeydrunk-identity-api:$release"
          az acr login --name acrhdshareddev
          docker build --build-arg "RELEASE_ID=$release" --tag "$tag" .
          docker push "$tag"
          digest=$(az acr repository show --name acrhdshareddev --image "honeydrunk-identity-api:$release" --query digest -o tsv)
          printf 'image=acrhdshareddev.azurecr.io/honeydrunk-identity-api@%s\nrelease=%s\n' "$digest" "$release" >> "$GITHUB_OUTPUT"
      - name: Update serving image and verify release plus SQL readiness
        env:
          APP: ${{ vars.IDENTITY_APP_NAME }}
          IMAGE: ${{ inputs.operation == 'rollback' && inputs.rollback-image || steps.build.outputs.image }}
          RELEASE: ${{ inputs.operation == 'rollback' && inputs.rollback-release-id || steps.build.outputs.release }}
        run: python3 scripts/deploy_app_service.py --app-name "$APP" --image "$IMAGE" --release-id "$RELEASE"
      - name: Retain image and rollback evidence even after health failure
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: identity-dev-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: deployment-evidence/
          retention-days: 30
          if-no-files-found: warn
