name: Deployment validation

on:
  pull_request:
    branches: [main, feat/identity-foundation]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build Azure SQL target without platform compatibility overrides
        run: dotnet build src/HoneyDrunk.Identity.Database/HoneyDrunk.Identity.Database.sqlproj -c Release -p:DSP=Microsoft.Data.Tools.Schema.Sql.SqlAzureV12DatabaseSchemaProvider -p:OutputPath=bin/AzureSql/ -p:RestoreLockedMode=true
      - name: Build non-root API image (no push or Azure login)
        run: docker build --tag identity-validation .
      - uses: actions/upload-artifact@v6
        with:
          name: identity-azure-sql
          path: src/HoneyDrunk.Identity.Database/bin/AzureSql/*.dacpac
          if-no-files-found: error
