name: PR

on:
  pull_request:
    branches: [ main, feat/identity-foundation ]
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  pr-core:
    name: PR Core
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      checks: write
      issues: write
      pull-requests: write
      security-events: write  # CodeQL SARIF upload
    uses: HoneyDrunkStudios/HoneyDrunk.Actions/.github/workflows/pr-core.yml@main
    with:
      dotnet-version: '10.0.x'
      configuration: 'Release'
      runs-on: 'ubuntu-latest'
      working-directory: '.'
      project-path: './HoneyDrunk.Identity/HoneyDrunk.Identity.slnx'
      enable-secret-scan: true
      enable-accessibility-check: false
      patch-coverage-threshold: 75
      absolute-coverage-floor: 70
      post-pr-summary: true
      actions-ref: 'main'
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}

  sonarcloud:
    name: SonarQube Cloud
    # Runs on:
    #   - pull_request (same-repo, after pr-core succeeds) for PR-time analysis
    #   - push to main (standalone) for main-branch analysis that populates the
    #     SonarCloud Overview dashboard and leak-period baseline.
    # `always()` is required because pr-core is skipped on push events; without
    # it, GitHub Actions skips downstream jobs whose declared `needs:` was skipped.
    if: |
      always() && (
        (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.pr-core.result == 'success') ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main')
      )
    needs: pr-core
    permissions:
      contents: read
      checks: write
      pull-requests: write
    # Pin the merged gate-wait, T-SQL and Cloud new-code measures fixes.
    uses: HoneyDrunkStudios/HoneyDrunk.Actions/.github/workflows/job-sonarcloud.yml@cb2e5880f4e4529c417b1542262b27ca49fcd58d
    with:
      dotnet-version: '10.0.x'
      runs-on: 'ubuntu-latest'
      working-directory: '.'
      project-path: './HoneyDrunk.Identity/HoneyDrunk.Identity.slnx'
      sonar-organization: 'honeydrunkstudios'
      sonar-project-key: 'honeydrunkstudios_HoneyDrunk.Identity'
      sonar-tsql: true
      coverage-artifact-name: 'coverage-reports-ubuntu-latest'
    secrets:
      sonar-token: ${{ secrets.SONAR_TOKEN }}
      github-token: ${{ secrets.GITHUB_TOKEN }}

  sonar-findings:
    name: Sonar New-Code Findings
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: sonarcloud
    uses: HoneyDrunkStudios/HoneyDrunk.Actions/.github/workflows/job-sonarcloud-quality-gate.yml@cb2e5880f4e4529c417b1542262b27ca49fcd58d
    with:
      sonar-organization: 'honeydrunkstudios'
      sonar-project-key: 'honeydrunkstudios_HoneyDrunk.Identity'
      mode: enforce
    secrets:
      sonar-token: ${{ secrets.SONAR_TOKEN }}

  sonar-reporting-diagnostics:
    name: Sonar Reporting Diagnostics
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Read reporting metadata without changing Sonar settings
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: python
        run: |
          import json
          import os
          import re
          import urllib.error
          import urllib.parse
          import urllib.request

          token = os.environ.get("SONAR_TOKEN", "")
          if not token:
              raise SystemExit("SONAR_TOKEN is unavailable; reporting diagnosis cannot run.")

          # Never follow redirects with authorization, or dump response bodies,
          # request headers, scannerContext, source files or exception messages.
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          opener = urllib.request.build_opener(NoRedirect())
          def read(path, **params):
              url = "https://sonarcloud.io/api/" + path + "?" + urllib.parse.urlencode(params)
              request = urllib.request.Request(url, headers={"Authorization": "Bearer " + token})
              try:
                  with opener.open(request, timeout=30) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  print(json.dumps({"endpoint": path, "httpStatus": error.code}))
              except (OSError, ValueError):
                  print(json.dumps({"endpoint": path, "unavailable": True}))
              return {}

          def safe_warning(value):
              value = str(value).replace(token, "[redacted]")
              value = re.sub(r"https?://\S+", "[URL omitted]", value)
              return " ".join(value.split())[:500]

          project = "honeydrunkstudios_HoneyDrunk.Identity"
          # Existing main-target PR #1 task, needed to distinguish a decoration
          # failure from Free-plan restrictions on non-main PR targets.
          task = read("ce/task", id="AaEm2x-vlLooC1-UC7Ln", additionalFields="warnings").get("task", {})
          print(json.dumps({"mainTargetTask": {key: task.get(key) for key in
              ("id", "status", "componentKey", "analysisId", "warningCount")},
              "warnings": [safe_warning(value) for value in task.get("warnings", [])]}))
          branches = read("project_branches/list", project=project).get("branches", [])
          print(json.dumps({"mainBranches": [{"name": item.get("name"), "isMain": item.get("isMain"),
              "analysisDate": item.get("analysisDate")} for item in branches if item.get("isMain")]}))
          requests = read("project_pull_requests/list", project=project).get("pullRequests", [])
          print(json.dumps({"pullRequests": [{key: item.get(key) for key in
              ("key", "branch", "base", "analysisDate", "status")} for item in requests
              if str(item.get("key")) in ("1", "5")]}))
          # Only issue identifiers/rules/locations, never messages or source snippets.
          for number in ("1", "5"):
              gate = read("qualitygates/project_status", projectKey=project, pullRequest=number).get("projectStatus", {})
              print(json.dumps({"pullRequest": number, "qualityGate": {
                  "status": gate.get("status"), "conditions": [{key: item.get(key) for key in
                      ("status", "metricKey", "comparator", "errorThreshold", "actualValue")}
                      for item in gate.get("conditions", [])]}}))
              findings = read("issues/search", componentKeys=project, pullRequest=number, resolved="false", ps=500)
              print(json.dumps({"pullRequest": number, "paging": findings.get("paging"),
                  "issues": [{key: item.get(key) for key in
                      ("key", "rule", "component", "line", "type", "severity", "status", "resolution")}
                      for item in findings.get("issues", [])]}))

  coverage-baseline-ratchet:
    name: Coverage Baseline Ratchet
    if: github.event_name == 'push'
    permissions:
      contents: write
      checks: write
    uses: HoneyDrunkStudios/HoneyDrunk.Actions/.github/workflows/coverage-baseline-ratchet.yml@main
    with:
      dotnet-version: '10.0.x'
      configuration: 'Release'
      runs-on: 'ubuntu-latest'
      working-directory: '.'
      project-path: './HoneyDrunk.Identity/HoneyDrunk.Identity.slnx'
      actions-ref: 'main'
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
