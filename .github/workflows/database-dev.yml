name: Review Identity dev schema

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Revalidate the reviewed artifacts after approval. SQL execution is held pending the target-state concurrency design.'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: identity-dev-schema
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    # Use a reviewed runner with stable allowed egress; never open SQL to all Azure services.
    runs-on: ${{ vars.IDENTITY_SQL_RUNNER || 'ubuntu-latest' }}
    environment: dev-schema-plan
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Validate reviewed setup
        env:
          ENABLED: ${{ vars.IDENTITY_SCHEMA_APPROVED }}
          SERVER: ${{ vars.IDENTITY_SQL_SERVER }}
          RUNNER: ${{ vars.IDENTITY_SQL_RUNNER }}
        run: test "$ENABLED" = 'true' && test -n "$SERVER" && test -n "$RUNNER"
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build the Azure SQL DACPAC
        run: |
          dotnet tool restore
          dotnet build HoneyDrunk.Identity/HoneyDrunk.Identity.Database/HoneyDrunk.Identity.Database.sqlproj -c Release -p:DSP=Microsoft.Data.Tools.Schema.Sql.SqlAzureV12DatabaseSchemaProvider -p:OutputPath=bin/AzureSql/ -p:RestoreLockedMode=true
          mkdir -p schema-review
          cp HoneyDrunk.Identity/HoneyDrunk.Identity.Database/bin/AzureSql/*.dacpac schema-review/identity.dacpac
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Generate Script and DeployReport only
        shell: pwsh
        env:
          SERVER: ${{ vars.IDENTITY_SQL_SERVER }}
        run: ./scripts/Review-DevDatabase.ps1 -Server $env:SERVER -Package schema-review/identity.dacpac -ReviewDirectory schema-review -SourceRevision $env:GITHUB_SHA
      - uses: actions/upload-artifact@v6
        with:
          name: schema-review-${{ github.sha }}
          path: schema-review/
          retention-days: 7
          if-no-files-found: error
  publish:
    if: inputs.publish
    needs: plan
    runs-on: ${{ vars.IDENTITY_SQL_RUNNER || 'ubuntu-latest' }}
    environment: dev-schema-publish
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Require environment reviewers and explicit setup approval
        env:
          GH_TOKEN: ${{ github.token }}
          ENABLED: ${{ vars.IDENTITY_SCHEMA_APPROVED }}
        run: |
          set -euo pipefail
          test "$ENABLED" = 'true'
          gh api "repos/$GITHUB_REPOSITORY/environments/dev-schema-publish" --jq '.protection_rules[] | select(.type == "required_reviewers") | .reviewers | length' | grep -Eq '^[1-9][0-9]*$'
      - uses: actions/download-artifact@v7
        with:
          name: schema-review-${{ github.sha }}
          path: schema-review
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet tool restore
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Verify reviewed artifact and script drift (execution held)
        shell: pwsh
        env:
          SERVER: ${{ vars.IDENTITY_SQL_SERVER }}
        run: ./scripts/Review-DevDatabase.ps1 -Action Publish -Server $env:SERVER -Package schema-review/identity.dacpac -ReviewDirectory schema-review -SourceRevision $env:GITHUB_SHA
