name: Container security

on:
  pull_request:
    paths: ['Dockerfile', '.github/workflows/container-security.yml']
  push:
    branches: [main]
    paths: ['Dockerfile', '.github/workflows/container-security.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Build patched SDK and runtime image
        run: |
          docker build --pull --file Dockerfile --tag dependency-security:runtime .
      - name: Verify non-root runtime and patched APT packages
        run: |
          test "$(docker run --rm --entrypoint id dependency-security:runtime -u)" -ne 0
          docker run --rm --entrypoint dpkg-query dependency-security:runtime -W -f='${Package} ${Version}\n' apt libapt-pkg7.0
      - name: Scan final image without registry push
        run: |
          docker save dependency-security:runtime --output image.tar
          docker run --rm --volume "$PWD:/work" aquasec/trivy@sha256:bcc376de8d77cfe086a917230e818dc9f8528e3c852f7b1aff648949b6258d1c image --input /work/image.tar --format json --output /work/container-scan.json --severity HIGH,CRITICAL --exit-code 1
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: container-security-report
          path: container-scan.json
          if-no-files-found: warn
